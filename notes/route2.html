<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>“旧二路终点”位置 - 旧闻夹</title><link href="../styles.css" rel="stylesheet"/></head><body class="site-notes" data-depth="1" data-site="notes"><header class="notes-head"><div><h1>旧闻夹</h1><p>sy0718 的个人资料页</p></div><div class="notes-small">最后更新：2026-09-08</div></header><nav class="notes-nav"><a href="index.html">首页</a><span>报刊页码</span><span>南关</span><span>随手记</span><span>链接</span></nav><main class="notes-article"><h1>“旧二路终点”位置</h1><div class="notes-meta">2026-08-14 22:10</div><p>老人口中的“旧二路终点”不是现在东河桥那个站。九十年代指西郊停车场北边，离南关早市步行大约四十分钟。</p><p>公交公司1998年的站名沿革能对上。论坛里2012年还有人继续这么叫。</p><p>先记这个，免得后面把两个地点混了。</p><p>1998年的公交线路表写的是“西郊停车场”，当地人还是会说“老二路头”。2012论坛帖子里两个叫法同时出现，查时间线时得把这个区别写清，不然看着像两个地方。</p></main><div id="investigator-ui"></div><script src="../game-core.js"></script><script src="../app.js"></script></body></html>
