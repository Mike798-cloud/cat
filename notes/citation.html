<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>缩微报怎么记页码 - 旧闻夹</title><link href="../styles.css" rel="stylesheet"/></head><body class="site-notes" data-depth="1" data-site="notes"><header class="notes-head"><div><h1>旧闻夹</h1><p>sy0718 的个人资料页</p></div><div class="notes-small">最后更新：2026-09-08</div></header><nav class="notes-nav"><a href="index.html">首页</a><span>报刊页码</span><span>南关</span><span>随手记</span><span>链接</span></nav><main class="notes-article"><h1>缩微报怎么记页码</h1><div class="notes-meta">2026-08-21 19:04</div><p>给自己留个格式：报纸名 / 日期 / 版次 / 标题。缩微胶卷画面如果缺角，页码后面加“？”。</p><p>市图书馆地方文献室只能拍索引卡，正文要申请打印。老报OCR会把“巷”识成“港”，地名最好再看原图。</p><p>南关材料集中在1996年11月23日至29日，之后报道突然少很多。</p><p>馆员说同一天不同版的缩微片偶尔会装反，看到日期和星期对不上时先别急着抄。上次把24日三版记成四版，回去又重跑一趟。以后拍索引卡，省得靠记忆。</p></main><div id="investigator-ui"></div><script src="../game-core.js"></script><script src="../app.js"></script></body></html>
