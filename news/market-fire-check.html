<header class="news-head"><div class="news-brand"><b>鹤宁晚报</b><small>HENING EVENING NEWS</small></div><div class="news-date">2026年9月13日　星期日</div></header><nav class="news-nav"><span class="">首页</span><span class="active">本地</span><span class="">社会</span><span class="">民生</span><span class="">教育</span><span class="">文化</span><span class="">数字报刊</span></nav><main class="news-page article-page"><div class="crumb">首页 &gt; 本地</div><h1>南关老市场完成秋季消防检查</h1><div class="article-meta">2026-09-12 17:20　来源：鹤宁晚报</div><p>昨日，南关街道联合消防救援部门对老市场餐饮摊位、仓储间和沿街商铺进行了集中检查。现场发现的灭火器过期、私拉电线等问题已要求经营户限期整改。</p><p>市场管理方表示，本月下旬还将重新检查两处封闭多年的后巷出口，营业时间不作调整。</p><p class="muted">编辑：许婧　校对：马晨</p></main><footer class="news-footer">鹤宁晚报社版权所有　互联网新闻信息服务备案：HN-NEWS-2006-017　编辑部电话：0437-6210***</footer>
